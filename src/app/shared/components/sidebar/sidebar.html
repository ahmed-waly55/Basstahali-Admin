<aside class="sidebar" dir="rtl" aria-label="التنقل الرئيسي">
  <div class="sidebar-brand">
    <a routerLink="/home" aria-label="بسطهالي — لوحة المتابعة" class="brand-link">
      <span class="brand-logo"><img src="favicon.png" alt="" width="52" height="52" /></span>
      <span><strong>بسطهالي<span class="brand-dot">.</span></strong><small>لوحة إدارة الأكاديمية</small></span>
    </a>
    <button type="button" class="sidebar-close" (click)="closeRequested.emit()" aria-label="إغلاق القائمة"><mat-icon>close</mat-icon></button>
  </div>
  <nav class="sidebar-navigation">
    @for (section of sections; track section.label) {
      <section class="nav-section" [attr.aria-label]="section.label">
        <h2>{{ section.label }}</h2>
        @for (item of section.items; track item.route) {
          <a [routerLink]="item.route" routerLinkActive="is-active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
            <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon><span>{{ item.label }}</span><span class="active-indicator" aria-hidden="true"></span>
          </a>
        }
      </section>
    }
  </nav>
  <div class="sidebar-footer"><mat-icon aria-hidden="true">admin_panel_settings</mat-icon><span>مساحة عمل الإدارة</span><span class="version-label" aria-hidden="true">ADMIN</span></div>
</aside>
