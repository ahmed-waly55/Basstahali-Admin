<aside class="w-64 h-screen bg-white border-l border-slate-100 flex flex-col justify-between sticky top-0 z-40 shadow-xs transition-all duration-300" dir="rtl">

  <!-- Top Section: Logo & Navigation -->
  <div class="flex flex-col h-full">

    <!-- Logo Area -->
    <div class="h-18 px-6 flex items-center gap-3 border-b border-slate-50">
      <div class="w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-indigo-200">
        لو
      </div>
      <div class="flex flex-col">
        <span class="text-sm font-bold text-slate-800">منصة الإدارة</span>
        <span class="text-[10px] text-slate-400 font-medium">الإصدار التجريبي 2.0</span>
      </div>
    </div>

    <!-- Navigation Links -->
    <div class="flex-1 px-4 py-6 space-y-6 overflow-y-auto">

      @for (section of navSections; track section.title) {
        <div class="space-y-1.5">
          <p class="px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3">{{ section.title }}</p>

          @for (item of section.items; track item.route) {
            <a [routerLink]="item.route"
               routerLinkActive="bg-indigo-50/80 text-indigo-600 font-bold border-indigo-100 shadow-xs"
               [routerLinkActiveOptions]="{exact: true}"
               class="flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 hover:bg-indigo-50/40 hover:text-indigo-600 font-medium text-xs transition-all duration-200 group">
              <mat-icon class="text-slate-400 group-hover:text-indigo-600 transition-colors">{{ item.icon }}</mat-icon>
              <span>{{ item.label }}</span>
            </a>
          }
        </div>
      }

    </div>
  </div>

  <!-- Bottom Section: Quick Support Card -->
  <div class="p-4 border-t border-slate-50">
    <div class="p-3.5 rounded-2xl bg-indigo-50/50 border border-indigo-100/50 flex flex-col gap-2">
      <div class="flex items-center gap-2 text-indigo-700 font-bold text-xs">
        <mat-icon class="text-sm">support_agent</mat-icon>
        <span>الدعم الفني</span>
      </div>
      <p class="text-[11px] text-slate-500 leading-relaxed">تواجه مشكلة في النظام؟ تواصل مع فريق المساعدة.</p>
      <button class="mt-1 w-full py-2 bg-white hover:bg-indigo-600 hover:text-white text-indigo-600 font-bold text-xs rounded-xl border border-indigo-100 transition-all duration-200 shadow-2xs">
        مراكز المساعدة
      </button>
    </div>
  </div>

</aside>
