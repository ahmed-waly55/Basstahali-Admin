<aside class="brand-sidebar" dir="rtl" aria-label="التنقل الرئيسي">
  <a routerLink="/home" class="sidebar-brand" aria-label="بسطهالي — الرئيسية">
    <img src="favicon.png" alt="أكاديمية بسطهالي" width="100" height="100" />
    <span class="brand-caption">مساحة الإدارة <span>ADMIN SPACE</span></span>
  </a>
  <div class="sidebar-section-label">إدارة الأكاديمية</div>
  <nav class="sidebar-nav">
    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="nav-active" ariaCurrentWhenActive="page"
         [routerLinkActiveOptions]="{exact: item.route !== '/users'}" class="sidebar-link">
        <mat-icon>{{ item.icon }}</mat-icon><span>{{ item.label }}</span>
        <mat-icon class="nav-chevron">chevron_left</mat-icon>
      </a>
    }
  </nav>
  <div class="sidebar-bottom">
    <div class="academy-note"><span class="note-dot"></span><div><strong>كل شيء أبسط مع بسطهالي</strong><small>التعليم يبدأ من إدارة أفضل</small></div></div>
    <button (click)="logout()" class="logout-button"><mat-icon>logout</mat-icon><span>تسجيل الخروج</span></button>
  </div>
</aside>
