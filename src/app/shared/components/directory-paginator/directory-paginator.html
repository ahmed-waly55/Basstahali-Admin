<nav class="directory-paginator" aria-label="تصفح صفحات الحسابات" dir="rtl">
  <label>سجلات في الصفحة<select [value]="pageSize" (change)="changeSize($event)" [disabled]="disabled" aria-label="عدد السجلات في الصفحة">@if(!pageSizes.includes(pageSize)){<option [value]="pageSize">{{ pageSize }}</option>}@for(size of pageSizes;track size){<option [value]="size">{{ size }}</option>}</select></label>
  <span class="directory-range" aria-live="polite">{{ rangeLabel }}</span>
  <div class="directory-controls"><span>الصفحة {{ pageNumber }}@if(totalPages!==null && totalPages>0){ من {{ totalPages }}}</span><button type="button" aria-label="الصفحة الأولى" [disabled]="disabled || !hasPreviousPage" (click)="go(1)"><mat-icon>last_page</mat-icon></button><button type="button" aria-label="الصفحة السابقة" [disabled]="disabled || !hasPreviousPage" (click)="go(pageNumber-1)"><mat-icon>chevron_right</mat-icon></button><button type="button" aria-label="الصفحة التالية" [disabled]="disabled || !hasNextPage" (click)="go(pageNumber+1)"><mat-icon>chevron_left</mat-icon></button>@if(totalPages!==null && totalPages>0){<button type="button" aria-label="الصفحة الأخيرة" [disabled]="disabled || !hasNextPage" (click)="go(totalPages)"><mat-icon>first_page</mat-icon></button>}</div>
</nav>
