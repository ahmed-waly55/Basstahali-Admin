<div class="p-6 max-w-7xl mx-auto" dir="rtl">

      <!-- استخدام @if لإخفاء الكروت تماماً لو دخلنا على صفحة الابن -->
      @if (isMainUsersPage) {
        <!-- رأس الصفحة -->
        <div class="mb-8">
          <h1 class="text-2xl font-bold text-slate-800">إدارة المستخدمين والصلاحيات</h1>
          <p class="text-sm text-slate-500 mt-1">اختر القسم المطلوب للانتقال إلى لوحة التحكم الخاصة به</p>
        </div>

        <!-- شبكة الكروت -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
          @for (item of sections; track item.route) {
            <div matRipple
                 [routerLink]="item.route"
                 [class]="item.color + ' relative p-6 rounded-2xl border-2 transition-all duration-300 cursor-pointer shadow-sm hover:shadow-md flex flex-col justify-between group'">

              @if (item.badge) {
                <span class="absolute top-4 left-4 text-xs font-semibold px-2.5 py-0.5 rounded-full bg-white/80 shadow-xs text-slate-700">
                  {{ item.badge }}
                </span>
              }

              <div class="w-14 h-14 rounded-xl bg-white shadow-xs flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300">
                <mat-icon class="text-3xl !w-auto !h-auto">{{ item.icon }}</mat-icon>
              </div>

              <div>
                <h3 class="text-lg font-bold mb-1 text-slate-900">{{ item.title }}</h3>
                <p class="text-xs text-slate-600 leading-relaxed">{{ item.description }}</p>
              </div>

              <div class="mt-6 flex items-center text-xs font-semibold opacity-80 group-hover:opacity-100">
                <span>دخول القسم</span>
                <mat-icon class="text-base mr-1 transform group-hover:-translate-x-1 transition-transform">arrow_forward</mat-icon>
              </div>

            </div>
          }
        </div>
      }

      <!-- مكان عرض الابن (سيتم تحميله وإخفاء الكروت القديمة تلقائياً) -->
      <div class="mt-4">
        <router-outlet></router-outlet>
      </div>

    </div>
