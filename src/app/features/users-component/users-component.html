<section class="users-directory" dir="rtl">
  @if (isMainUsersPage()) {
    <header class="directory-heading">
      <span class="directory-eyebrow">إدارة الحسابات</span>
      <h1>المستخدمون</h1>
      <p>الوصول إلى حسابات الطلاب والمعلمين وفريق الإدارة من مكان واحد.</p>
    </header>
    <div class="directory-grid">
      @for (item of sections; track item.route) {
        <a [routerLink]="item.route" class="directory-card">
          <div class="directory-icon" [class.report-icon]="item.route === 'reports'"><mat-icon aria-hidden="true">{{ item.icon }}</mat-icon></div>
          <div class="directory-content">
            <h2>{{ item.title }}</h2>
            <p>{{ item.description }}</p>
            <span class="directory-action">{{ item.action }}<mat-icon aria-hidden="true">arrow_back</mat-icon></span>
          </div>
        </a>
      }
    </div>
  }
  <router-outlet></router-outlet>
</section>
