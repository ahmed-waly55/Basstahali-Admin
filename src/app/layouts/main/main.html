<div class="min-h-screen bg-slate-50 flex flex-col font-sans relative overflow-x-hidden" dir="rtl">

  <!-- Mobile Sidebar Backdrop (يظهر فقط عند فتح القائمة في الموبايل) -->
  @if (isSidebarOpen) {
    <div (click)="onToggleSidebar()"
         class="fixed inset-0 bg-slate-900/25 backdrop-blur-2xs z-40 md:hidden transition-opacity">
    </div>
  }

  <!-- Main Wrapper (Sidebar + Content Area) -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- Sidebar Component (يختفي تماماً من الشاشة الكبيرة عند إغلاقه ليتمدد الهيدر) -->
    <app-sidebar
      [class.translate-x-full]="!isSidebarOpen"
      [class.md:-mr-64]="!isSidebarOpen"
      class="fixed md:static top-0 right-0 h-full z-50 transition-all duration-300 ease-in-out">
    </app-sidebar>

    <!-- Main Content Area (الهيدر + محتوى الـ Routes) -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto transition-all duration-300">

      <!-- Header Component -->
      <app-header [isSidebarOpen]="isSidebarOpen" (toggleSidebar)="onToggleSidebar()"></app-header>

      <!-- Dynamic Page Content -->
      <main class="flex-1 p-4 md:p-6">
        <router-outlet></router-outlet>
      </main>

    </div>
  </div>

</div>
