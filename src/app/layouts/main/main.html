<div class="admin-shell" dir="rtl" [class.sidebar-open]="isSidebarOpen">
  <a class="skip-link" href="#admin-main">تخطي إلى المحتوى</a>
  @if (isSidebarOpen && isMobileViewport) { <button type="button" tabindex="-1" class="sidebar-backdrop" aria-label="إغلاق قائمة التنقل" (click)="closeSidebar()"></button> }
  <app-sidebar id="admin-sidebar" class="admin-sidebar" [attr.inert]="!isSidebarOpen ? '' : null" [attr.aria-hidden]="!isSidebarOpen" [cdkTrapFocus]="isMobileViewport && isSidebarOpen" [cdkTrapFocusAutoCapture]="isMobileViewport && isSidebarOpen" (closeRequested)="closeSidebar()"></app-sidebar>
  <div class="admin-workspace">
    <app-header class="admin-header" [isSidebarOpen]="isSidebarOpen" (toggleSidebar)="onToggleSidebar()" (navigationOpened)="onNavigationOpened()"></app-header>
    <main id="admin-main" class="admin-main" tabindex="-1"><router-outlet></router-outlet></main>
  </div>
</div>
