<div class="min-h-screen bg-slate-50 flex flex-col font-sans relative overflow-x-hidden" dir="rtl">

  <!-- خلفية معتمة تظهر فقط في الموبايل عند فتح السيدبار وعند الضغط عليها يغلق -->
  @if (isSidebarOpen) {
    <div (click)="closeSidebar()"
         class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 md:hidden transition-opacity cursor-pointer">
    </div>
  }

  <!-- Main Wrapper -->
  <div class="flex flex-1 relative">

    <!-- Sidebar Component -->
    <app-sidebar
      [class.translate-x-full]="!isSidebarOpen"
      class="fixed top-0 right-0 h-screen z-50 transition-transform duration-300 ease-in-out">
    </app-sidebar>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 transition-all duration-300 pt-16"
         [class.md:mr-64]="isSidebarOpen"
         [class.md:mr-0]="!isSidebarOpen">

      <!-- Header Component -->
      <app-header
        [isSidebarOpen]="isSidebarOpen"
        (toggleSidebar)="onToggleSidebar()"
        class="fixed top-0 left-0 right-0 z-30 transition-all duration-300"
        [class.md:right-64]="isSidebarOpen"
        [class.md:right-0]="!isSidebarOpen">
      </app-header>

      <!-- Dynamic Page Content -->
      <main class="flex-1 p-4 md:p-6">
        <router-outlet></router-outlet>
      </main>

    </div>
  </div>

</div>
